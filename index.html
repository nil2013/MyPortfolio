                    <div class="space-y-4 text-base leading-relaxed text-gray-700" data-lang-ja='<p>法学の基礎理論を研究しています。具体的には、「議論」や「論証」といった概念を中心に据え、論理学の哲学や計算機科学の知見を参照しつつ、法解釈や法的判断といったものの性質や特徴を明らかにすることを試みています。 また、その成果を応用して、法学と他分野の知見とを（それぞれの分野の知見の相違を適切に踏まえつつ、）接続する方法を模索する、といったことも試みています。</p><p>小学校の図書館で「マイコンBASICマガジン」に出会って以来、プログラムを書くことが趣味です。好きな言語はScalaですが、ちょっと触ったことがある程度を含めれば大抵の言語は書いたことがあります。学生時代は学業の傍らのべ3社でエンジニアとして勤務してきましたので、Java, Scala, JavaScript, Obj-C, Swift, Pythonあたりは業務での使用経験もあります。ソフトウェア工学やプログラミング言語論、型システムなどにも興味関心があり、そうした知見を生かした研究テーマも模索しています。実定法の勉強も好きなので、システム開発契約についても研究しています。</p>' data-lang-en='<p>My research focuses is on the foundational theories of law. Specifically, I examine the nature and characteristics of legal interpretation and judgment by centering on concepts such as "proof," "argument," and "argumentation," with reference to insights from the philosophy of logic and computer science. I also explore ways to apply these findings to connect legal studies with other fields, appropriately considering the differences in their respective knowledge.</p><p>Ever since encountering "Mycom BASIC Magazine" in my elementary school library, programming has been my hobby. While Scala is my favorite language, I have experience with most languages to some extent. During my student years, I worked as an engineer at three companies, gaining professional experience with Java, Scala, JavaScript, Obj-C, Swift, and Python. I am also interested in software engineering, programming language theory, and type systems, and I am exploring research themes that utilize this knowledge. I also enjoy studying positive law and am researching system development contracts.</p>'>

        document.addEventListener('DOMContentLoaded', () => {
            const langToggle = document.getElementById('lang-toggle');
            const publicationList = document.getElementById('publication-list');
            const searchInput = document.getElementById('search-pubs');
            const filterBtns = document.getElementById('filter-btns');
            const majorToggle = document.getElementById('major-toggle');
            const backToTopBtn = document.getElementById('back-to-top');

            let currentLang = 'ja';
            let majorOnly = true;
            if (majorOnly) majorToggle.classList.add('active');
            
            const categoryMap = {
                paper: { ja: '論文', en: 'Paper', class: 'category-paper' },
                book: { ja: '著書', en: 'Book', class: 'category-book' },
                presentation: { ja: '講演', en: 'Talk', class: 'category-presentation' },
                misc: { ja: 'その他', en: 'Misc', class: 'category-misc' },
            };

            const renderPublications = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const activeFilter = filterBtns.querySelector('.bg-indigo-600').dataset.filter;
                
                const filteredPubs = allPublications.filter(p => {
                    const matchesMajor = !majorOnly || p.major;
                    const matchesFilter = activeFilter === 'all' || p.category === activeFilter;
                    const matchesSearch = p.ja.toLowerCase().includes(searchTerm) || p.en.toLowerCase().includes(searchTerm);
                    return matchesMajor && matchesFilter && matchesSearch;
                });

                if (filteredPubs.length === 0) {
                     publicationList.innerHTML = `<p class="text-center text-gray-500" data-lang-ja="該当する業績はありません。" data-lang-en="No matching publications found."></p>`;
                     updateLanguage(currentLang, true); 
                     return;
                }

                publicationList.innerHTML = filteredPubs.map(p => {
                    const category = categoryMap[p.category];
                    const categoryTag = `<span class="category-tag ${category.class}" data-lang-ja="${category.ja}" data-lang-en="${category.en}">${category[currentLang]}</span>`;
                    const majorStar = p.major ? `<i class="fa-solid fa-star major-star"></i>` : '';
                    const textContent = `<span class="lang-content">${p[currentLang]}</span>`;

                    let linkIcon = '';
                    let publicationContent = textContent;

                    if (p.url) {
                        linkIcon = ` <i class="fa-solid fa-link text-xs text-indigo-400 opacity-70 group-hover:opacity-100 transition-opacity"></i>`;
                        publicationContent = `<a href="${p.url}" target="_blank" rel="noopener noreferrer" class="publication-link group">${textContent}${linkIcon}</a>`;
                    }

                    return `<li class="card p-4 flex items-start">
                                <div class="flex-shrink-0 w-6">${majorStar}</div>
                                <div class="flex-grow"><p>${categoryTag}${publicationContent}</p></div>
                             </li>`;
                }).join('');
            };

            const updateLanguage = (lang, partialUpdate = false) => {
                const scope = partialUpdate ? publicationList : document;

                scope.querySelectorAll('[data-lang-ja]').forEach(el => {
                    const text = el.dataset[`lang${lang.charAt(0).toUpperCase() + lang.slice(1)}`];
                    if (text !== undefined) {
                        if (el.dataset.langJa.includes('<p>')) { el.innerHTML = text; } 
                        else if (el.tagName === 'INPUT') { el.placeholder = text; }
                        else { el.textContent = text; }
                    }
                });

                if (partialUpdate) {
                    // Re-render publications to apply language change to dynamic content
                    renderPublications();
                } else {
                    currentLang = lang;
                    if (lang === 'en') { langToggle.classList.add('en'); } 
                    else { langToggle.classList.remove('en'); }
                    document.documentElement.lang = lang;
                    localStorage.setItem('language', lang);
                    renderPublications(); 
                }
            };
            
            filterBtns.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    filterBtns.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('bg-indigo-600', 'text-white');
                        btn.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    e.target.classList.add('bg-indigo-600', 'text-white');
                    e.target.classList.remove('bg-gray-200', 'text-gray-700');
                    updateLanguage(currentLang, true);
                }
            });

            majorToggle.addEventListener('click', () => {
                majorOnly = !majorOnly;
                majorToggle.classList.toggle('active');
                updateLanguage(currentLang, true);
            });

            searchInput.addEventListener('input', () => {
                updateLanguage(currentLang, true);
            });
            
            langToggle.addEventListener('click', () => {
                const newLang = currentLang === 'ja' ? 'en' : 'ja';
                updateLanguage(newLang);
            });
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
            
            window.addEventListener('scroll', () => {
                backToTopBtn.style.display = (window.pageYOffset > 300) ? 'flex' : 'none';
            });
            backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            let initialLang = localStorage.getItem('language') || (navigator.language.startsWith('ja') ? 'ja' : 'en');
            updateLanguage(initialLang);
        });
    </script>
